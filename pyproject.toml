[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialscene-maker"
version = "0.1.0"
description = "Experimental SpatialScene V3 generator from RGB images and custom depth maps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0"
]

[project.scripts]
spatialscene-maker = "spatialscene_maker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
